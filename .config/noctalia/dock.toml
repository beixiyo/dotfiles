# Noctalia 底部 Dock

[dock]
# 平时隐藏，鼠标触碰屏幕底边时显示
enabled = true
position = "bottom"
auto_hide = true

# 不根据工作区是否有窗口改变显示逻辑，只由底边悬停控制
smart_auto_hide = false
# 覆盖在窗口上方，不长期占用桌面空间
layer = "overlay"
reserve_space = false

# 图标略大于紧凑模式，并用均匀留白保持点击目标和视觉节奏
icon_size = 32
item_spacing = 6
main_axis_padding = 14
cross_axis_padding = 8

# 与屏幕底边留出距离，形成独立悬浮 Dock
margin_edge = 8

# 半透明背景配合轻量阴影和更柔和的圆角
background_opacity = 0.78
shadow = true
radius = 20

# 悬停时自然放大，仍限制倍率避免明显跳动
magnification = true
magnification_scale = 1.35
inactive_scale = 0.9
active_scale = 1.0
inactive_opacity = 0.88
active_opacity = 1.0

# 显示运行状态圆点；同一应用有多个窗口时显示数量
show_dots = true
show_instance_count = true
