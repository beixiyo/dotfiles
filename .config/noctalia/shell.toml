# Noctalia Shell 基础行为
#
# Noctalia 负责状态栏、Dock、通知、OSD、剪贴板、壁纸与主题取色
# Hyprlock、Swayidle 和 polkit-gnome 暂时保留，作为尚未迁移功能与回退方案

[shell]
# 不上传匿名遥测数据
telemetry_enabled = false

# 只使用本地功能，不主动访问 Noctalia 在线服务
offline_mode = true

# 由 Noctalia 提供图形化 Polkit 提权认证
polkit_agent = true

# 启用 Noctalia 剪贴板历史
clipboard_enabled = true

# 在设置界面显示高级选项
settings_show_advanced = true

# 界面使用简体中文
lang = "zh-Hans"

# 浮动面板的统一视觉与定位
[shell.panel]
# 面板透明模式：solid 不透明 | soft 轻透 | glass 明显透底
transparency_mode = "soft"

# 为浮动面板保留细描边和投影，使其与壁纸保持边界
borders = true
shadow = true

# 控制中心脱离 Bar，固定在屏幕右上角
control_center_placement = "floating"
control_center_position = "top_right"

# 浮动面板与屏幕边缘的距离，单位为逻辑像素
floating_offset = 10

# 固定位置后不跟随 Bar 组件的点击位置
open_near_click_control_center = false

# 壁纸选择器使用独立居中浮层，避免全屏透出壁纸导致文字失去对比度
wallpaper_placement = "floating"
wallpaper_position = "center"

# 固定居中后不跟随 Bar 壁纸按钮的位置
open_near_click_wallpaper = false
