# 锁屏与空闲行为
#
# 远程使用策略：允许自动锁屏和关闭显示器，但绝不因空闲自动休眠。

# 启用 Noctalia 锁屏 UI
[lockscreen]
enabled = true

# 使用桌面壁纸而非锁屏前的桌面截图，避免泄露窗口内容
blurred_desktop = false

# 适度模糊并加深主题色遮罩，让紧凑登录框保持清晰
blur_intensity = 0.35
tint_intensity = 0.45

# 两个 timeout 都从最后一次输入开始计算
[idle]
behavior_order = ["lock", "screen-off"]
pre_action_fade_seconds = 2.0

# 15 分钟无操作后锁屏
[idle.behavior.lock]
enabled = true
timeout = 900
action = "lock"

# 17 分钟无操作后关闭显示器；输入恢复时 Noctalia 自动重新点亮
[idle.behavior.screen-off]
enabled = true
timeout = 1020
action = "screen_off"
